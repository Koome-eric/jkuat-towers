services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: jkuat
      POSTGRES_PASSWORD: jkuat_dev_pw
      POSTGRES_DB: jkuat_towers
    ports:
      - "5432:5432"
    volumes:
      - jkuat_towers_pgdata:/var/lib/postgresql/data

volumes:
  jkuat_towers_pgdata:
